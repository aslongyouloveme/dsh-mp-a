  <path d="m470 222 58-6 5 24-60 11Z" fill="#4caaa0" stroke="#264b4b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M369 291c25-24 51-18 76 1l67 36 115 5c11 0 15 14 4 19l-124 9c-43-6-89-12-119-33" fill="#f3f1e7" stroke="#264b4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m389 303 30 18m-40-5 28 17" fill="none" stroke="#d4dbd0" stroke-width="4" stroke-linecap="round"/>
  <!-- Near leg bends down to the forward pedal. -->
  <path d="m426 376 48 67-14 78 65 64" fill="none" stroke="#efa94e" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m519 578 29 6-14 10h-25Z" fill="#efa94e" stroke="#264b4b" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#91a894" stroke-width="4" stroke-linecap="round">
    <path d="m127 577-5-17m7 10 9-11m678 28 5-19m-2 11 13-7"/>
  </g>
  <g fill="none" stroke="#91b4ad" stroke-width="5" stroke-linecap="round">
    <path d="M204 381h48m-77 24h61m-12 24h28"/>
  </g>
</svg>
